# ── LLM Provider ──────────────────────────────────────────────────────────
# provider: "siliconflow" (cloud) or "ollama" (local)
# For SiliconFlow, get your API key at https://cloud.siliconflow.cn/account/ak
llm:
  provider: "siliconflow"               # ollama | siliconflow
  model: "deepseek-ai/DeepSeek-V4-Flash" # main LLM for reasoning & tool calling
  vision_model: "Qwen/Qwen3-VL-32B-Instruct"  # VLM for screenshot analysis
  base_url: "http://localhost:11434"     # only used when provider=ollama
  api_key: "sk-imvftvlkbfdfvhsulbpsqxhkmjgzymngszcanyfsnslonbdb"                            # SiliconFlow API key (or set SILICONFLOW_API_KEY env var)
  context_limit: 10

